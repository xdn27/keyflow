# Contoh konfigurasi KeyFlow. Salin ke direktori config OS sebagai `keyflow/config.yaml`.
# Skema lengkap: docs/agents/config.md
version: 1

settings:
  dry_run: false            # true = hanya tampilkan apa yang akan terjadi
  notifications: true
  on_conflict: rename       # rename | skip | overwrite | ask  (default aman: rename)
  create_missing_dirs: true
  undo_history_limit: 200

profiles:
  - name: Sorting Foto
    enabled: true
    # dry_run: true         # opsional: override per profil
    context:
      app: file_manager          # file_manager | nama proses spesifik
      path: "D:/Foto/Mentah/**"  # glob, opsional
      selection: image           # any | image | video | audio | document | ext:[jpg,png]
    rules:
      - key: "1"
        action: move
        to: "D:/Foto/01_Dipakai"
        then: select_next
      - key: "2"
        action: move
        to: "D:/Foto/02_Cadangan"
        then: select_next
      - key: "3"
        action: copy
        to: "D:/Foto/03_Posting"
      - key: "4"
        action: move
        to: "D:/Foto/04_Reject"
        then: select_next
      - key: "Ctrl+Shift+Z"
        action: undo
