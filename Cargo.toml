[workspace]
resolver = "2"
members = ["crates/keyflow-core", "crates/keyflow-platform", "crates/keyflow-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Dependensi sengaja belum ditambahkan. Tambahkan dengan `cargo add` agar
# mendapat versi terbaru, dan deklarasikan versi bersama di
# [workspace.dependencies] bila dipakai lebih dari satu crate.
# Dependensi OS-spesifik wajib di [target.'cfg(...)'.dependencies].

[workspace.dependencies]
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_norway = "0.9"
serde_json = "1.0"
globset = "0.4"
directories = "6.0"
notify = "8.0"
trash = "5.2"
tempfile = "3.14"
anyhow = "1.0"
crossbeam-channel = "0.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
